{% extends "base.html" %}
{% block title %}Choose a new password &middot; {{ store_name }}{% endblock %}

{% block content %}
<section class="authbox">
  <h1>Choose a new password</h1>
  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="10"
           required autocomplete="new-password" autofocus>
    <p class="hint">At least 10 characters, including a letter and a number.</p>

    <label for="confirm">Confirm new password</label>
    <input id="confirm" name="confirm" type="password" minlength="10"
           required autocomplete="new-password">

    <button type="submit" class="btn btn--primary btn--lg btn--block">
      Update password
    </button>
  </form>
  <p class="muted small">This link works once and expires shortly.</p>
</section>
{% endblock %}
