{% extends "base.html" %}
{% block title %}Create an account &middot; {{ store_name }}{% endblock %}

{% block content %}
<section class="authbox">
  <h1>Create your account</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="name">Name</label>
    <input id="name" name="name" value="{{ form.name }}" maxlength="60"
           required autocomplete="name" autofocus>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.email }}"
           maxlength="120" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="10"
           required autocomplete="new-password">
    <p class="hint">At least 10 characters, including a letter and a number.</p>

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" minlength="10"
           required autocomplete="new-password">

    <button type="submit" class="btn btn--primary btn--lg btn--block">Create account</button>
  </form>

  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
</section>
{% endblock %}
